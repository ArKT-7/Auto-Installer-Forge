name: Forge Auto-Installer zip

on:
  workflow_dispatch:
    inputs:
      rom_zip_url:
        description: 'Direct link to Recovery ROM zip file'
        required: true
      device_code:
        description: 'Device codename (e.g. "nabu")'
        required: true
        default: 'nabu'
      rom_name:
        description: 'ROM name (e.g. "DerpFest")'
        required: true
      rom_maintainer:
        description: 'ROM maintainer'
        required: true
      android_ver:
        description: 'Android version'
        required: true
        default: '16'
        type: choice
        options:
          - 16
          - 15
          - 14
          - 13
          - 12
          - 11
      device_name:
        description: 'Device name'
        required: true
        default: 'Xiaomi Pad 5'
      security_patch_date:
        description: 'Security patch level date (e.g. "01 Dec 2025")'
        required: true
        default: '01 Dec 2025'
      rom_version:
        description: 'build identifier/ROM version'
        required: true
        default: 'v16.0-20251107-nabu-UNOFFICIAL-Stable'
      root_type:
        description: 'Select root method present in ROM'
        required: true
        default: 'KernelSu Next v3.2.0'
        type: choice
        options:
          - KernelSu Next v3.2.0
          - KernelSu Next v1.1.1
          - KernelSu v1.0.5-80-legacy
          - KernelSu v1.0.1
          - Sukisu-Ultra
          - No Root
      format_default:
        description: 'Select the default behavior when flashing via recovery.'
        required: true
        default: 'Dirty Flash (Update only - keeps user data)'
        type: choice
        options:
          - Dirty Flash (Update only - keeps user data)
          - Clean Flash (Factory reset - wipes all data)
      verify_super:
        description: 'Verify super.img integrity? (Extracts & hashes, takes MUCH longer)'
        required: true
        default: 'No'
        type: choice
        options:
          - 'Yes'
          - 'No'
      install_twrp:
        description: 'Integrate TWRP? (ONLY if kernel supports it! Else bootloop to fastboot)'
        required: true
        default: 'No'
        type: choice
        options:
          - 'Yes'
          - 'No'

jobs:
  Forge-Auto-Installer:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Pre-check ROM zip content with PeekXtract
        id: PeekXtract_check
        run: |
          echo "Downloading PeekXtract..."
          curl -L -o PeekXtract https://github.com/ArKT-7/PeekXtract/releases/download/v2.0.4/PeekXtract
          chmod +x PeekXtract
          URL="${{ github.event.inputs.rom_zip_url }}"
          echo "Scanning Remote ZIP: $URL"

          set +e
          ./PeekXtract "$URL" --e-txt 2>&1 | tee PeekXtract_log.txt
          set -e
          echo "Analyzing PeekXtract results..."
          
          if grep -Fq "Export complete" PeekXtract_log.txt; then
              echo "PeekXtract successfully inspected the ZIP."
              if grep -qE "payload\.bin|super\.(img|zst|img\.zst)" peekxtract_files_dump.txt; then
                  echo "Info: Pre-check PASSED, Valid ROM structure detected."
                  exit 0
              else
                  echo "Error: Pre-check FAILED, ZIP is readable but valid ROM files (payload.bin or super) are MISSING. Aborting."
                  exit 1
              fi
          else
              echo "Warning: PeekXtract could not verify the file (Network/Format issue), Proceeding without pre-check."
              exit 0
          fi

      - name: Download ROM zip with original filename
        id: download
        run: |
          URL="${{ github.event.inputs.rom_zip_url }}"
          mkdir -p input
          cd input
          echo "Downloading..."
          curl -L -O -J "$URL"
          filename=$(ls -A | head -n1)
          if [ -z "$filename" ]; then
            echo "Error: Download failed, No .zip file found."
            exit 1
          fi
          echo "Downloaded file: input/$filename"
          if [[ "$filename" =~ \.[zZ][iI][pP]$ ]]; then
              echo "File has a valid .zip extension, Keeping original name"
          else
              echo "File is missing .zip extension (likely named 'download'), Renaming..."
              mv "$filename" "rom.zip"
              filename="rom.zip"
          fi
          if ! unzip -lqq "$filename" > /dev/null; then
             echo "Error: File is not a valid zip archive! (Likely an HTML landing page or corrupted download)"
             exit 1
          fi
          
          echo "Info: Download verified successfully."
          echo "filename=$filename" >> $GITHUB_OUTPUT

      - name: Map input strings to numbers for updating variables in conf
        run: |
          case "${{ github.event.inputs.root_type }}" in
            "KernelSu Next v3.2.0") ROOT_TYPE=0; ROOT_LABEL="Kernel Su Next v3.2.0" ;;
            "KernelSu Next v1.1.1") ROOT_TYPE=1; ROOT_LABEL="Kernel Su Next v1.1.1" ;;
            "KernelSu v1.0.5-80-legacy") ROOT_TYPE=2; ROOT_LABEL="Kernel Su v1.0.5-80-legacy" ;;
            "KernelSu v1.0.1") ROOT_TYPE=3; ROOT_LABEL="Kernel Su v1.0.1" ;;
            "Sukisu-Ultra") ROOT_TYPE=4; ROOT_LABEL="Sukisu-Ultra" ;;
            "No Root") ROOT_TYPE=5; ROOT_LABEL="No Root" ;;
            *) ROOT_TYPE=0; ROOT_LABEL="Kernel Su Next v3.2.0" ;;
          esac
          echo "ROOT_TYPE=$ROOT_TYPE" >> $GITHUB_ENV

          case "${{ github.event.inputs.format_default }}" in
            "Dirty Flash (Update only - keeps user data)") FORMAT_MODE=0; FORMAT_LABEL="Dirty Flash (Update only - keeps user data)" ;;
            "Clean Flash (Factory reset - wipes all data)") FORMAT_MODE=1; FORMAT_LABEL="Clean Flash (Factory reset - wipes all data)" ;;
            *) FORMAT_MODE=0; FORMAT_LABEL="Update" ;;
          esac
          echo "FORMAT_MODE=$FORMAT_MODE" >> $GITHUB_ENV

          if [ "${{ github.event.inputs.verify_super }}" == "Yes" ]; then
            VERIFY_SUPER=1
            VERIFY_LABEL="Yes"
          else
            VERIFY_SUPER=0
            VERIFY_LABEL="No (Faster)"
          fi
          echo "VERIFY_SUPER=$VERIFY_SUPER" >> $GITHUB_ENV

          if [ "${{ github.event.inputs.install_twrp }}" == "Yes" ]; then
            INSTALL_TWRP=1
            TWRP_LABEL="Yes (Kernel Must Support It)"
          else
            INSTALL_TWRP=0
            TWRP_LABEL="No"
          fi
          echo "INSTALL_TWRP=$INSTALL_TWRP" >> $GITHUB_ENV

          echo "Root method selected: $ROOT_LABEL"
          echo "Format type selected: $FORMAT_LABEL"
          echo "Verify Super.img selected: $VERIFY_LABEL"
          echo "Install TWRP selected: $TWRP_LABEL"

      - name: Generate autoinstaller.conf
        run: |
          cat <<EOF > input/autoinstaller.conf
          #!/sbin/sh
          #
          # Copyright (C) 2025-26 https://github.com/ArKT-7/Auto-Installer-Forge
          #
          # Made for flashing Android ROMs in recovery easily
          #
          
          # ================================ Configurations ================================         
          DEVICE_CODE="${{ github.event.inputs.device_code }}" # Device codename (must match your target device, e.g. "nabu" for Xiaomi Pad 5)
          ROM_NAME="${{ github.event.inputs.rom_name }}" # The name of the ROM you're flashing
          ROM_MAINTAINER="${{ github.event.inputs.rom_maintainer }}" # Name or handle of the ROM maintainer
          ANDROID_VER="${{ github.event.inputs.android_ver }}" # Android version
          DEVICE_NAME="${{ github.event.inputs.device_name }}" # Full device name
          BUILD_DATE="07 Nov 2025" # Build date of the ROM
          SECURITY_PATCH="${{ github.event.inputs.security_patch_date }}" # Security patch level of the ROM
          ROM_VERSION="${{ github.event.inputs.rom_version }}" # ROM version/build identifier
          
          # ASCII art to show first during flashing
          ASCII_ART_LINES=(
          " _     _ _      ___ "
          "(_) __| | | __ |__ \\"
          "| |/ _  | |/ /   / /"
          "| | (_| |   <   |_| "
          "|_|\\__,_|_|\\_\\  (_) "
          )
          
          # List of files and their SHA-1 hashes for verification after extraction
          # Format: "path/to/file.img" inside the auto-installer folder and "expected_sha1"
          HASH_PAIRS=(
            "images/idk.img" "yexidklolyexidklolyexidklolyexidklolyexx"
          )
          
          # Options for rooting, presented to the user, first option will be default
          # Format: "Display Name" "corresponding_boot_image_filename (without .img)"
          ROOT_TYPE=${{ env.ROOT_TYPE }}
          root_options_filename=(
            "Root with idk" "boot" "dtbo"
            "Root with Magisk v30.7" "magisk_boot" "dtbo"
          )
          
          FORMAT_DEFAULT=${{ env.FORMAT_MODE }}  # set 1 if want format default selected 
          VERIFY_SUPER=${{ env.VERIFY_SUPER }}
          INSTALL_TWRP=${{ env.INSTALL_TWRP }}
          SELECTION_TIMEOUT=15  # Seconds to wait before auto-selecting default menu option
          CHAR_WIDTH=54  		  # Max characters per printed line (used for text centering and wrapping)
          BANNER_EXIT=" ------------------------Error!------------------------ "  # Banner shown on critical exit or error
          
          # ============================== Configurations End ==============================
          EOF
          echo "Created input/autoinstaller.conf"

      - name: Run Auto-Installer Forge script
        run: |
          cat input/autoinstaller.conf
          chmod +x ./auto_installer.sh
          echo "Using zip file: input/${{ steps.download.outputs.filename }}"
          bash ./auto_installer.sh "input/${{ steps.download.outputs.filename }}" "input/autoinstaller.conf"

      - name: Find output subfolder
        id: find_folder
        run: |
          if [ -f "final_product_path.txt" ]; then
             FULL_PATH=$(cat final_product_path.txt)
             echo "Detected Output Path: $FULL_PATH"

             FOLDER_NAME=$(basename "$FULL_PATH")
             PARENT_DIR=$(dirname "$FULL_PATH")
             
             echo "subfolder=$FOLDER_NAME" >> $GITHUB_OUTPUT
             echo "output_base=$PARENT_DIR" >> $GITHUB_OUTPUT
          else
             echo "Error: Could not find output path file. Script might have failed."
             exit 1
          fi

      - name: Upload Auto-Installer zip file
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.find_folder.outputs.subfolder }}
          path: ${{ steps.find_folder.outputs.output_base }}/${{ steps.find_folder.outputs.subfolder }}/**